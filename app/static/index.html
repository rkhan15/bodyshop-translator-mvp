<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Body Shop Translator</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
      .card { border: 1px solid #ddd; border-radius: 12px; padding: 18px; }
      button { padding: 10px 14px; cursor: pointer; }
      .small { color: #666; font-size: 13px; }
    </style>
  </head>
  <body>
    <h2>Body Shop Work Order Translator</h2>
    <div class="card">
      <form id="uploadForm">
        <input type="file" id="file" name="file" accept="application/pdf" required />
        <button type="submit">Translate</button>
      </form>
      <p id="status" class="small"></p>
    </div>

    <script>
      function getFilenameFromDisposition(disposition) {
        if (!disposition) return "translated_work_order.pdf";

        const utf8Match = disposition.match(/filename\*=UTF-8''([^;]+)/);
        if (utf8Match) return decodeURIComponent(utf8Match[1]);

        const regularMatch = disposition.match(/filename="?([^"]+)"?/);
        if (regularMatch) return regularMatch[1];

        return "translated_work_order.pdf";
      }

      const form = document.getElementById("uploadForm");
      const status = document.getElementById("status");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        status.textContent = "Uploading and translating…";

        const fileInput = document.getElementById("file");
        const fd = new FormData();
        fd.append("file", fileInput.files[0]);

        const res = await fetch("/translate", { method: "POST", body: fd });

        if (!res.ok) {
          const txt = await res.text();
          status.textContent = "Error: " + txt;
          return;
        }

        const blob = await res.blob();
        const filename = getFilenameFromDisposition(res.headers.get("Content-Disposition"));

        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        window.URL.revokeObjectURL(url);

        status.textContent = "Done — download started.";
      });
    </script>
  </body>
</html>
